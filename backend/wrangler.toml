name = "pireplog-push"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ── Public config (safe to commit) ───────────────────────────────
[vars]
# VAPID public key — must match PUSH_PUBLIC_KEY in the PWA (index.html).
VAPID_PUBLIC_KEY = "BPglo8YU-D0XfYLwL88e0RJ2sjioQL8yKaSdu7M9HVauQOheaJE5XSOBh8iAIpLuoQjd61DAroG90YtT8o5Hn6w"
# Contact address included in VAPID (RFC 8292). Use your own.
ADMIN_CONTACT = "mailto:ops@example.com"

# ── Secrets (DO NOT put here — set with `wrangler secret put`) ────
#   wrangler secret put VAPID_PRIVATE_KEY      (required)
#   wrangler secret put API_KEY                (optional; guards /test and /alert)

# ── KV: stores push subscriptions ────────────────────────────────
# Create it once, then paste the id below:
#   wrangler kv namespace create SUBSCRIPTIONS
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# ── Optional: fire a scheduled test push near your flight time (UTC) ──
# [triggers]
# crons = ["30 12 * * *"]
